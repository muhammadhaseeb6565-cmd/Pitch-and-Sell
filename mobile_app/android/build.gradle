buildscript {
    ext {
        kotlin_version = '2.1.0'
        compileSdkVersion = 35
        ffmpegKitPackage = "min-gpl"
    }
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// This hook runs exactly after :app finishes evaluating, but BEFORE :app_links evaluates.
// It ensures the 'flutter' property exists globally and uses a String for compileSdkVersion
// so that flutter.groovy's substring(8) doesn't crash on older plugins.
project(":app").afterEvaluate {
    if (!rootProject.ext.has("flutter")) {
        rootProject.ext.flutter = [:]
    }
    rootProject.ext.flutter.compileSdkVersion = 35
        ffmpegKitPackage = "min-gpl"
    rootProject.ext.flutter.minSdkVersion = 23
    rootProject.ext.flutter.targetSdkVersion = 35
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}



subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 35
                defaultConfig {
                    minSdkVersion 24
                }
            }
        }
    }
}

