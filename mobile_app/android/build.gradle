buildscript {
    ext {
        kotlin_version = '2.1.0'
        compileSdkVersion = 35
    }
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Set global properties for flutter plugins
rootProject.ext {
    ffmpegKitPackage = "min-gpl"
}

project(":app").afterEvaluate {
    if (!rootProject.ext.has("flutter")) {
        rootProject.ext.flutter = [:]
    }
    rootProject.ext.flutter.compileSdkVersion = 35
    rootProject.ext.flutter.minSdkVersion = 24
    rootProject.ext.flutter.targetSdkVersion = 35
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
