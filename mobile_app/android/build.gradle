buildscript {
    ext {
        kotlin_version = '2.1.0'
        compileSdkVersion = 36
    }
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

project(":app").afterEvaluate {
    if (!rootProject.ext.has("flutter")) {
        rootProject.ext.flutter = [:]
    }
    rootProject.ext.flutter.compileSdkVersion = 36
    rootProject.ext.flutter.minSdkVersion = 24
    rootProject.ext.flutter.targetSdkVersion = 35
}

subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdk = 36
                ndkVersion = "26.1.10909125"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

