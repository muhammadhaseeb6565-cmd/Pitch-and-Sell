name: mobile_app
description: "Pitch and Sell - Emulgic's first short-form video commerce platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  video_player: ^2.8.2
  socket_io_client: ^3.1.1
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  flutter_secure_storage: ^11.0.0
  flutter_cache_manager: ^3.4.2
  app_links: ^7.2.1
  firebase_core: any
  firebase_messaging: any
  firebase_analytics: any
  firebase_crashlytics: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
