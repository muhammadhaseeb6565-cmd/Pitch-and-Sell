name: mobile_app
description: "Pitch and Sell - Emulgic's first short-form video commerce platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  video_player: ^2.8.2
  socket_io_client: ^3.1.1
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.2
  supabase_flutter: ^2.7.0
  intl: ^0.19.0
  image_picker: any
  shimmer: any
  flutter_secure_storage: any
  flutter_cache_manager: any
  app_links: any
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.3
  ffmpeg_kit_flutter_min_gpl: ^6.0.3
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  flutter_local_notifications: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
