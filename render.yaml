databases:
  - name: pitch-and-sell-db
    plan: free
    databaseName: pitch_and_sell

services:
  - type: web
    name: pitch-and-sell-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pitch-and-sell-db
          property: connectionString
      - key: PORT
        value: "10000"
